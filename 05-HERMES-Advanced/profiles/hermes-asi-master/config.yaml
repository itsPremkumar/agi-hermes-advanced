# config.yaml — HERMES-ASI-MASTER Unified Profile Configuration
# Location: ~/.hermes/profiles/hermes-asi-master/config.yaml
# Complete AGI/ASI-level executive runtime configuration

# --- Model & Reasoning Parameters ---
provider: "anthropic"
model: "claude-3-7-sonnet-20250219"
reasoning_effort: "high"
context_window: 200000
temperature: 0.2
max_tokens: 8192

# --- Terminal Backend & Sandboxing ---
terminal:
  backend: "docker"
  timeout_seconds: 180
  max_output_bytes: 102400
  container_image: "hermes-sandbox:latest"
  auto_cleanup: true

# --- Tiered Memory Engine ---
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 8000
  user_char_limit: 4000
  write_approval: true
  ttl_default_days: 90
  provenance_required: true
  spotlighting: true
  fts5_index_enabled: true

# --- Toolsets Stack ---
toolsets:
  enabled:
    - web_search
    - browser
    - file_read
    - file_write
    - terminal_exec
    - subagents
  health_check: true

# --- Search Superintelligence (5-Parallel Wave) ---
search:
  default_results: 10
  max_parallel_searches: 5
  timeout_seconds: 45
  freshness_preference: "high"
  language: "en"
  evidence_persistence: true
  browser_render_top_k: 3

# --- Autonomous Cognitive Engines & Routines ---
cognitive_engines:
  state_sync_enabled: true
  self_tracking_enabled: true
  belief_cascade_enabled: true
  sleep_cycle_cron: "0 2 * * *"
  world_reestimate_cron: "0 */4 * * *"
  curriculum_sync_cron: "0 0 * * 0"

# --- R0-R6 Permissions & Safety Guardrails ---
permissions:
  default_policy: "deny"
  approval_required_for: ["R4", "R5", "R6"]
  auto_approve: ["R0", "R1", "R2"]
  audit_log: true
  least_privilege: true
  spotlighting: true

# --- Sandboxing Policies ---
sandbox:
  enabled: true
  filesystem_policy: "restricted"
  network_policy: "limited"
  process_policy: "contained"
  resource_limits:
    memory_mb: 4096
    cpu_percent: 85
    timeout_seconds: 600
  attestation: true

# --- Swarm & Subagent Controls ---
agents:
  max_depth: 4
  max_fanout: 8
  default_budget_tokens: 16000
  default_timeout_seconds: 300
  require_termination_condition: true
  isolation: true

# --- Logging & Audit Observability ---
logging:
  level: "info"
  structured: true
  include_provenance: true
  redact_secrets: true
  retention_days: 60
  evidence_log: true
