name: Hermes ASI Master CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Skill Schema & Integrity Tests
        run: |
          pytest tests/test_skills_schema.py -v

      - name: Test 1-Click Installer (Dry Run)
        run: |
          python install.py --dry-run

      - name: Run Evaluation Harness Smoke Test
        run: |
          python evals/run_evals.py --list

      - name: Docker Build Smoke Test
        run: |
          docker build -t hermes-asi-master:ci -f 05-HERMES-Advanced/Dockerfile 05-HERMES-Advanced/
